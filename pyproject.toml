[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pokemon-rl"
version = "0.1.0"
description = "Autonomous JRPG Agent Research — Pokémon Red Long-Horizon RL"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
emulator = ["pyboy>=1.6.0"]
training = ["gymnasium>=0.29.0", "torch>=2.1.0"]
analysis = ["matplotlib>=3.7.0", "pandas>=2.0.0"]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "pyyaml>=6.0"]
all = ["pyboy>=1.6.0", "gymnasium>=0.29.0", "torch>=2.1.0",
       "matplotlib>=3.7.0", "pandas>=2.0.0",
       "pytest>=7.4.0", "pytest-cov>=4.1.0", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
